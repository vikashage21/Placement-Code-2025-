<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get or Post</title>
</head>
<body>

    <form method="get" action="http://localhost:4000/register">
        <input type="text" name="username" placeholder="Enter your name">
        <input type="text" name="password" placeholder="Enter your age">
        <button type="submit">Submit with GET</button>

    </form>

     <form method="post" action="http://localhost:4000/register">
        <input type="text" name="username" placeholder="Enter your name">
        <input type="text" name="password" placeholder="Enter your age">
        <button type="submit">Submit with post </button>

    </form>
    
</body>
</html>
