    <script>

        //  creating bank account

        class BankAccount {
            #transaction = []

            constructor(id, name, pw) {
                this.id = id;
                this.name = name;
                this.pw = pw
            }

            deposit(amt) {
                this.transaction.push(amt)
            }
        }

        let a1 = new BankAccount (101 , 'amit ' , 'amit123')
        console.log(a1)
        a1.deposit(1000)
        console.log(a1.#transaction)
    </script>
